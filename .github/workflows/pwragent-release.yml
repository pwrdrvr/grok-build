name: Build PwrAgent Grok distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "pwragent-v*"

permissions:
  contents: read
  id-token: none

concurrency:
  group: pwragent-grok-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: none
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Validate release signing contract
        run: python3 scripts/check-release-signing.py

      - name: Resolve downstream version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/pwragent-v* ]]; then
            version="${GITHUB_REF_NAME#pwragent-v}"
          else
            upstream_version="$(sed -n \
              '/^name = "xai-grok-pager-bin"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' \
              crates/codegen/xai-grok-pager-bin/Cargo.toml)"
            test -n "$upstream_version"
            version="${upstream_version}-pwragent.dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version is not SemVer: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
            executable: xai-grok-pager
            release_asset: ""
          - platform: macos-x86_64
            runner: macos-15-intel
            executable: xai-grok-pager
            release_asset: ""
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            executable: xai-grok-pager
            release_asset: pwragent-grok-${{ needs.metadata.outputs.version }}-linux-aarch64.tar.gz
          - platform: linux-x86_64
            runner: ubuntu-24.04
            executable: xai-grok-pager
            release_asset: pwragent-grok-${{ needs.metadata.outputs.version }}-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: none
    env:
      GROK_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_ASSET: ${{ matrix.release_asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Install DotSlash
        shell: bash
        run: cargo install dotslash --version 0.5.7 --locked

      - name: Install protoc for Intel macOS
        if: matrix.platform == 'macos-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          version="29.3"
          expected_sha256="9a788036d8f9854f7b03c305df4777cf0e54e5b081e25bf15252da87e0e90875"
          archive="${RUNNER_TEMP}/protoc-${version}-osx-x86_64.zip"
          install_root="${RUNNER_TEMP}/protoc-${version}-osx-x86_64"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-osx-x86_64.zip"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::protoc checksum mismatch: expected ${expected_sha256}, got ${actual_sha256}" >&2
            exit 1
          fi

          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          protoc="${install_root}/bin/protoc"
          test -x "$protoc"
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        run: cargo build -p xai-grok-pager-bin --release --features release-dist

      - name: Stage Unix distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "stage/${{ matrix.platform }}"
          cp "target/release/${{ matrix.executable }}" "stage/${{ matrix.platform }}/grok"
          chmod 0755 "stage/${{ matrix.platform }}/grok"
          cp LICENSE THIRD-PARTY-NOTICES SOURCE_REV "stage/${{ matrix.platform }}/"
          cat > "stage/${{ matrix.platform }}/PWRAGENT-BUILD.txt" <<EOF
          version=${GROK_VERSION}
          source_repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          source_commit=${GITHUB_SHA}
          source_revision=$(cat SOURCE_REV)
          platform=${{ matrix.platform }}
          EOF

      - name: Package Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -C "stage/${{ matrix.platform }}" -czf "$RELEASE_ASSET" .

      - name: Upload macOS signing input
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: raw-${{ matrix.platform }}
          path: stage/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux release asset
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.release_asset }}
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    name: Prepare macOS universal signing input
    needs:
      - metadata
      - build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: none
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Download macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raw-macos-*
          path: raw

      - name: Merge universal binary
        env:
          GROK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          lipo -create \
            raw/raw-macos-aarch64/grok \
            raw/raw-macos-x86_64/grok \
            -output stage/grok
          chmod 0755 stage/grok
          lipo stage/grok -verify_arch arm64 x86_64
          cp \
            raw/raw-macos-aarch64/LICENSE \
            raw/raw-macos-aarch64/THIRD-PARTY-NOTICES \
            raw/raw-macos-aarch64/SOURCE_REV \
            stage/
          cat > stage/PWRAGENT-BUILD.txt <<EOF
          version=${GROK_VERSION}
          source_repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          source_commit=${GITHUB_SHA}
          source_revision=$(cat stage/SOURCE_REV)
          platform=macos-universal
          EOF

      - name: Archive macOS signing input
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/macos-release-signing-input.tgz"
          tar -czf "$tarball" stage
          sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf "%s  macos-release-signing-input.tgz\n" "$sha256" \
            > "$RUNNER_TEMP/macos-release-signing-input.tgz.sha256"

      - name: Upload macOS signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-signing-input
          path: |
            ${{ runner.temp }}/macos-release-signing-input.tgz
            ${{ runner.temp }}/macos-release-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Package unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          GROK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: tar -C stage -czf "pwragent-grok-${GROK_VERSION}-macos-universal-unsigned.tar.gz" .

      - name: Upload unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-macos-universal
          path: pwragent-grok-*-macos-universal-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos-sign:
    name: Sign macOS universal binary
    if: startsWith(github.ref, 'refs/tags/pwragent-v')
    needs:
      - metadata
      - macos-universal
    runs-on: macos-15
    timeout-minutes: 15
    environment: apple-signing
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download macOS signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release-signing-input
          path: .release-input

      - name: Verify macOS signing input
        env:
          EXPECTED_SHA256: ${{ needs.macos-universal.outputs.signing-input-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd .release-input
          actual="$(shasum -a 256 macos-release-signing-input.tgz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          shasum -a 256 --check macos-release-signing-input.tgz.sha256

      - name: Expand macOS signing input
        shell: bash
        run: tar -xzf .release-input/macos-release-signing-input.tgz

      - name: Sign and verify macOS binary
        env:
          # Base64-encoded Developer ID Application .p12 and its export password.
          # Store both only on the apple-signing GitHub Environment.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: T44CNHC4UH
        shell: bash
        run: |
          set -euo pipefail
          : "${CSC_LINK:?CSC_LINK is required}"
          : "${CSC_KEY_PASSWORD:?CSC_KEY_PASSWORD is required}"
          identity="Developer ID Application: PwrDrvr LLC (${APPLE_TEAM_ID})"
          certificate="$RUNNER_TEMP/pwrdrvr-developer-id.p12"
          keychain="$RUNNER_TEMP/pwrdrvr-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT

          certificate_base64="${CSC_LINK#data:application/x-pkcs12;base64,}"
          printf '%s' "$certificate_base64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"${identity}\""

          codesign \
            --force \
            --keychain "$keychain" \
            --options runtime \
            --timestamp \
            --sign "$identity" \
            stage/grok
          codesign --verify --all-architectures --strict --verbose=2 stage/grok
          codesign --display --verbose=4 stage/grok 2> "$RUNNER_TEMP/grok-codesign.txt"
          grep -Fx "Authority=${identity}" "$RUNNER_TEMP/grok-codesign.txt"
          grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}" "$RUNNER_TEMP/grok-codesign.txt"
          lipo stage/grok -verify_arch arm64 x86_64

      - name: Package signed macOS distribution
        env:
          GROK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset="pwragent-grok-${GROK_VERSION}-macos-universal.tar.gz"
          tar -C stage -czf "$asset" .
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload signed macOS release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos-universal
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  windows-prepare:
    name: Prepare Windows signing input
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: none
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      GROK_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Install protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "29.3"
          $expectedSha256 = "57ea59e9f551ad8d71ffaa9b5cfbe0ca1f4e720972a1db7ec2d12ab44bff9383"
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "protoc-$version-win64"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "protoc checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $protoc = Join-Path $installRoot "bin/protoc.exe"
          if (-not (Test-Path -LiteralPath $protoc)) {
            throw "protoc.exe was not extracted to $protoc"
          }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        shell: bash
        run: cargo build -p xai-grok-pager-bin --release --features release-dist

      - name: Stage Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "stage/windows-x86_64" | Out-Null
          Copy-Item "target/release/xai-grok-pager.exe" "stage/windows-x86_64/grok.exe"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES, SOURCE_REV "stage/windows-x86_64/"
          @"
          version=$env:GROK_VERSION
          source_repository=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY
          source_commit=$env:GITHUB_SHA
          source_revision=$((Get-Content SOURCE_REV -Raw).Trim())
          platform=windows-x86_64
          "@ | Set-Content "stage/windows-x86_64/PWRAGENT-BUILD.txt"

      - name: Archive Windows signing input
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "windows-release-signing-input.tgz"
          & tar.exe -czf $archive stage/windows-x86_64 scripts/release
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to archive Windows signing input (exit code $LASTEXITCODE)."
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$sha256  windows-release-signing-input.tgz" |
            Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload Windows signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-signing-input
          path: |
            ${{ runner.temp }}/windows-release-signing-input.tgz
            ${{ runner.temp }}/windows-release-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Package unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "stage/windows-x86_64/*"
          -DestinationPath "pwragent-grok-$env:GROK_VERSION-windows-x86_64-unsigned.zip"

      - name: Upload unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-x86_64
          path: pwragent-grok-*-windows-x86_64-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Authenticode-sign Windows x64 binary
    if: startsWith(github.ref, 'refs/tags/pwragent-v')
    needs:
      - metadata
      - windows-prepare
    runs-on: windows-2022
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download Windows signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-signing-input
          path: .release-input

      - name: Verify Windows signing input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-prepare.outputs.signing-input-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = ".release-input/windows-release-signing-input.tgz"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Windows signing input digest mismatch: expected $env:EXPECTED_SHA256, got $actual."
          }
          $recorded = (Get-Content "$archive.sha256" -Raw).Trim()
          if ($recorded -ne "$actual  windows-release-signing-input.tgz") {
            throw "Windows signing input checksum file does not match the downloaded archive."
          }

      - name: Expand Windows signing input
        shell: pwsh
        run: |
          & tar.exe -xzf .release-input/windows-release-signing-input.tgz
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows signing input (exit code $LASTEXITCODE)."
          }

      - name: Install TrustedSigning
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/release/install-trusted-signing.ps1

      - name: Sign and verify Windows binary
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ./scripts/release/sign-windows-binary.ps1 -BinaryPath stage/windows-x86_64/grok.exe

      - name: Package signed Windows distribution
        shell: pwsh
        env:
          GROK_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          Compress-Archive
          -Path "stage/windows-x86_64/*"
          -DestinationPath "pwragent-grok-$env:GROK_VERSION-windows-x86_64.zip"

      - name: Upload signed Windows release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-x86_64
          path: pwragent-grok-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/pwragent-v')
    needs:
      - metadata
      - build
      - macos-sign
      - windows-sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 4
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; downstream assets are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "PwrAgent Grok ${VERSION}" \
            --notes "Downstream Grok Build binaries for PwrAgent. Source commit: ${GITHUB_SHA}. macOS and Windows executables are signed by PwrDrvr LLC."
